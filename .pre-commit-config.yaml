# Run `pre-commit install` once per clone; `pre-commit run --all-files` to check everything.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^docs/research/ocr-benchmark/ground-truth-draft/
      - id: end-of-file-fixer
        exclude: ^docs/research/ocr-benchmark/ground-truth-draft/
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: plan-file-caps
        name: TODO/ROADMAP line caps
        entry: python tools/check_plan_caps.py
        language: system
        files: ^(TODO|ROADMAP)\.md$
