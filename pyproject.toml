[project]
name = "docketyard"
version = "0.0.0"
description = "A public record of proceedings before the Surface Transportation Board"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "pytest", "pre-commit"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Deliberate selection, not ruff's drifting defaults:
# E/W pycodestyle, F pyflakes, I import order, UP modernize, B bugbear.
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
