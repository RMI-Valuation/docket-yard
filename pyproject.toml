[project]
name = "docketyard"
version = "0.0.0"
description = "A public record of proceedings before the Surface Transportation Board"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
# The web tier earns its dependencies (decided 2026-08-25): server-rendered HTML, an ASGI
# server, templates. No frontend framework. Everything else stays standard library.
dependencies = ["fastapi>=0.115", "jinja2>=3.1", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pre-commit", "httpx"]  # httpx: FastAPI's TestClient

[project.scripts]
docketyard = "docketyard.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"docketyard.store" = ["*.sql"]
"docketyard.web" = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Deliberate selection, not ruff's drifting defaults:
# E/W pycodestyle, F pyflakes, I import order, UP modernize, B bugbear.
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# repo-local temp root: the user-wide pytest temp dir on this Windows box holds stale
# junctions that break pytest's cleanup pass with Access Denied
addopts = "--basetemp=.pytest_tmp"
