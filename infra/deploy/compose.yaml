# Production on the one Lightsail instance (ADR 0012). Copy this directory to
# /srv/docketyard on the box; settings come from a sibling `.env` (see docketyard.env.example).
#
#   docker compose pull && docker compose up -d      # deploy the tag in .env (pull-based)
#   docker compose logs -f ingest                    # watch the poller

# the mail sender (docketyard.alerts.mail) derives its SES SMTP password from these; both
# web (confirmation mail) and ingest (alerts) send
x-mail: &mail
  DY_EMAIL_KEY: ${DY_EMAIL_KEY:-}  # addresses at rest; see docs/runbook.md
  DY_SES_REGION: ${DY_SES_REGION:-${AWS_REGION}}
  DY_MAIL_FROM: ${DY_MAIL_FROM:-Docket Yard <alerts@docketyard.org>}
  DY_SES_CONFIGURATION_SET: ${DY_SES_CONFIGURATION_SET:-}
  DY_SES_FEEDBACK_TOPIC: ${DY_SES_FEEDBACK_TOPIC:-}
  DY_HOST: ${DY_HOST:-docketyard.org}
  DY_OPERATOR_EMAIL: ${DY_OPERATOR_EMAIL:-}  # the weekly traffic digest; unset = none
  AWS_REGION: ${AWS_REGION}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

services:
  migrate:
    # runs the release's migrations once and exits; web refuses a store that is behind,
    # so everything waits on this rather than racing it (`status` connects, which migrates)
    image: ghcr.io/rmi-valuation/docket-yard:${DY_TAG}
    command: ["status"]
    volumes:
      - ./data:/data
    restart: "no"

  web:
    image: ghcr.io/rmi-valuation/docket-yard:${DY_TAG}
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./data:/data
    environment:
      <<: *mail  # the confirmation email is sent by the web process
      DY_S3_BUCKET: ${DY_S3_BUCKET}  # a pruned document is fetched from the store on view
      # ADR 0019: unset means /metrics is a 404 — the surface does not exist until it is
      # deliberately turned on, so an unconfigured deployment leaks nothing, not even that
      DY_METRICS_TOKEN: ${DY_METRICS_TOKEN:-}
      # the internet-facing process holds its own key: read blobs and send mail, nothing
      # that writes, deletes or lists (IAM user docketyard-web); the ingest keys stay out
      AWS_ACCESS_KEY_ID: ${DY_WEB_AWS_ACCESS_KEY_ID:?the web tier needs its own key}
      AWS_SECRET_ACCESS_KEY: ${DY_WEB_AWS_SECRET_ACCESS_KEY:?the web tier needs its own key}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    # THE READER-FACING PROCESS MUST NOT BE ABLE TO TAKE THE RECORD-KEEPING ONE WITH IT.
    # On 2026-09-02 a crawler on FD 35087's comment pages drove this process to 850 MB and
    # 167% of a two-core box; `ingest` could no longer complete a pass, captures stopped at
    # 03:26 while the site still answered until 05:06, and the box wedged until a manual
    # reboot at 10:18 — 6 h 52 m in which the record was not kept (coverage gap 1).
    # Capped, it is OOM-killed and `restart: unless-stopped` brings it back, which is the
    # difference between "the site blipped" and "the record stopped for seven hours".
    # 768 MB against a measured 110-170 MB steady state and a 1,906 MB box: roughly five
    # times normal, and below the 850 MB at which the box began to thrash. Blobs are
    # streamed to a temp file in CHUNK-sized reads (`web/documents.py`), so the record's
    # 1.07 GB PDF does not sit in memory and this ceiling does not bound document size.
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/')"]
      interval: 60s
      timeout: 5s
      start_period: 15s

  ingest:
    image: ghcr.io/rmi-valuation/docket-yard:${DY_TAG}
    command: ["poll", "--every", "${DY_POLL_EVERY:-1800}"]
    volumes:
      - ./data:/data
    environment: *mail
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]

  backfill:
    # a wave, run by hand and resumable:  docker compose run --rm backfill --start 2024-08-01
    # writes the same store the poller keeps; stamped backfill, so it can never alert
    image: ghcr.io/rmi-valuation/docket-yard:${DY_TAG}
    entrypoint: ["docketyard", "--db", "/data/docketyard.sqlite", "--data-dir", "/data", "backfill"]
    volumes:
      - ./data:/data
    profiles: [backfill]
    read_only: true
    tmpfs: [/tmp]

  litestream:
    # continuous replication of the SQLite store to S3: the backup and the prod-to-dev path
    image: litestream/litestream:0.3
    command: ["replicate", "-config", "/etc/litestream.yml"]
    user: "1000:1000"  # the app's uid: a root-owned -wal/-shm would lock the app out
    volumes:
      - ./data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    environment:
      DY_S3_BUCKET: ${DY_S3_BUCKET}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  alloy:
    # ADR 0019: scrapes web's /metrics and the host's vital signs, and remote_writes them to
    # Grafana Cloud. It is NOT what detects a dead box — it dies with the box; the detector
    # is an alert in Grafana Cloud on these series ceasing to arrive, which is off the box.
    # Under the `metrics` profile so the stack runs unchanged until the credential exists:
    #   docker compose --profile metrics up -d alloy
    # pinned like every other service here: this is the thing that watches the box, and a
    # pull-based deploy taking a config-breaking major would leave it crash-looping quietly
    image: grafana/alloy:v1.10.0
    # --storage.path or the remote_write WAL lands in the container layer and every recreate
    # silently drops whatever it had buffered — which is exactly the metrics from an incident
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      # the unix exporter reads the host, not the container
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    environment:
      DY_METRICS_TOKEN: ${DY_METRICS_TOKEN:-}
      GRAFANA_REMOTE_WRITE_URL: ${GRAFANA_REMOTE_WRITE_URL:-}
      GRAFANA_REMOTE_WRITE_USER: ${GRAFANA_REMOTE_WRITE_USER:-}
      GRAFANA_REMOTE_WRITE_TOKEN: ${GRAFANA_REMOTE_WRITE_TOKEN:-}
    profiles: [metrics]
    restart: unless-stopped
    # it watches the box; it must never be what strains it
    mem_limit: 256m

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # maintenance (ADR 0020): the flag directory the proxy checks per request, and the
      # page it serves. Both read-only to caddy — the toggle is `touch`/`rm` on the host,
      # so entering maintenance never depends on the application being up.
      - ./data/flags:/flags:ro
      - ./maintenance.html:/srv/maintenance/maintenance.html:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DY_HOST: ${DY_HOST:-docketyard.org}
    restart: unless-stopped
    depends_on: [web]

volumes:
  alloy-data:
  caddy-data:
  caddy-config:
