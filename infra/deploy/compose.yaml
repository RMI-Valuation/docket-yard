# Production on the one Lightsail instance (ADR 0012). Copy this directory to
# /srv/docketyard on the box; settings come from a sibling `.env` (see docketyard.env.example).
#
#   docker compose pull && docker compose up -d      # deploy the tag in .env (pull-based)
#   docker compose logs -f ingest                    # watch the poller

# the mail sender (docketyard.alerts.mail) derives its SES SMTP password from these; both
# web (confirmation mail) and ingest (alerts) send
x-mail: &mail
  DY_EMAIL_KEY: ${DY_EMAIL_KEY:-}  # addresses at rest; see docs/runbook.md
  DY_SES_REGION: ${DY_SES_REGION:-${AWS_REGION}}
  DY_MAIL_FROM: ${DY_MAIL_FROM:-Docket Yard <alerts@docketyard.org>}
  DY_SES_CONFIGURATION_SET: ${DY_SES_CONFIGURATION_SET:-}
  DY_SES_FEEDBACK_TOPIC: ${DY_SES_FEEDBACK_TOPIC:-}
  DY_HOST: ${DY_HOST:-docketyard.org}
  DY_OPERATOR_EMAIL: ${DY_OPERATOR_EMAIL:-}  # the weekly traffic digest; unset = none
  AWS_REGION: ${AWS_REGION}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

services:
  migrate:
    # runs the release's migrations once and exits; web refuses a store that is behind,
    # so everything waits on this rather than racing it (`status` connects, which migrates)
    image: ghcr.io/rmi-valuation/docket-yard:${DY_TAG}
    command: ["status"]
    volumes:
      - ./data:/data
    restart: "no"

  web:
    image: ghcr.io/rmi-valuation/docket-yard:${DY_TAG}
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./data:/data
    environment:
      <<: *mail  # the confirmation email is sent by the web process
      DY_S3_BUCKET: ${DY_S3_BUCKET}  # a pruned document is fetched from the store on view
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/')"]
      interval: 60s
      timeout: 5s
      start_period: 15s

  ingest:
    image: ghcr.io/rmi-valuation/docket-yard:${DY_TAG}
    command: ["poll", "--every", "${DY_POLL_EVERY:-1800}"]
    volumes:
      - ./data:/data
    environment: *mail
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]

  backfill:
    # a wave, run by hand and resumable:  docker compose run --rm backfill --start 2024-08-01
    # writes the same store the poller keeps; stamped backfill, so it can never alert
    image: ghcr.io/rmi-valuation/docket-yard:${DY_TAG}
    entrypoint: ["docketyard", "--db", "/data/docketyard.sqlite", "--data-dir", "/data", "backfill"]
    volumes:
      - ./data:/data
    profiles: [backfill]
    read_only: true
    tmpfs: [/tmp]

  litestream:
    # continuous replication of the SQLite store to S3: the backup and the prod-to-dev path
    image: litestream/litestream:0.3
    command: ["replicate", "-config", "/etc/litestream.yml"]
    user: "1000:1000"  # the app's uid: a root-owned -wal/-shm would lock the app out
    volumes:
      - ./data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    environment:
      DY_S3_BUCKET: ${DY_S3_BUCKET}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DY_HOST: ${DY_HOST:-docketyard.org}
    restart: unless-stopped
    depends_on: [web]

volumes:
  caddy-data:
  caddy-config:
