# /etc/systemd/system/user-1000.slice.d/limits.conf — bound what ad-hoc work can take.
#
# WHY THIS EXISTS. On 2026-09-05 an operator query — `python3 -` fed a heredoc over ssh —
# never received EOF, so the ssh session stayed open and the process ran for 22 hours pinning
# one of the box's two vCPUs at 99%. Alone that was survivable and the site served through it.
# When `docketyard-blobs.timer` then took another 43-76% on 2026-09-06, the web container was
# left fighting for a fraction of a core: requests took 8-30 s, the healthcheck failed,
# `webwatch` restarted the container, and the restarts made it worse. Load average reached 20
# on 2 vCPU. 183 requests in 3 minutes — about one a second — is what it could not serve.
#
# The class of fault is not "that one query". It is that ANY ad-hoc command, run by a person
# or by an agent at a person's direction, can take the whole box away from the service. This
# caps the class rather than the instance of it.
#
# WHY THE USER SLICE IS THE RIGHT PLACE. Checked on the box, 2026-09-06: `user-1000.slice`
# holds nothing operational. Every real thing — dockerd, containerd, the web/ingest/caddy/
# litestream/alloy containers, and the docketyard-blobs, -dump, -prune and -webwatch timers —
# lives in `system.slice` and is untouched by this. What lives here is interactive ssh work
# and whatever it spawns, which is exactly the class that caused the outage.
#
# 50% MEANS HALF OF ONE CORE, not half the box: systemd's CPUQuota is per-core-equivalent, and
# this instance has two. So the services keep at least 1.5 cores whatever anyone runs. The
# rogue would have been throttled to half a core and the site would not have gone down.
#
# THE COST IS REAL AND ACCEPTED: legitimate analysis gets slower. Reading all 976,058 live
# pages took 150 s on 2026-09-05; under this it takes a few times that. The answer to wanting
# it faster is to restore a Litestream replica and query THAT instead of the serving store —
# which is the fix this one only bounds.
#
# Memory is HIGH before MAX on purpose: `MemoryHigh` throttles and reclaims, `MemoryMax` kills.
# A slow ad-hoc job is a nuisance; an OOM-killed one mid-write is how a person loses work.
[Slice]
CPUAccounting=yes
CPUQuota=50%
MemoryAccounting=yes
MemoryHigh=1G
MemoryMax=2G
