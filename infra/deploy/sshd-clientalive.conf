# /etc/ssh/sshd_config.d/10-docketyard-clientalive.conf — reap sessions whose client is gone.
#
# The 2026-09-06 outage's process was held open by an ssh session from the previous day that
# had never closed. sshd's defaults never probe: `ClientAliveInterval 0` means a session whose
# client has vanished can persist until the box reboots, and anything it spawned with it.
#
# HONEST LIMIT: this would probably NOT have caught that one. When it was found, sshd was
# still alive and the connection had not dropped — so there was a client, or at least a TCP
# peer that had not gone away. This closes the adjacent hole (a session whose client really
# has vanished), and the cap in `user-slice-limits.conf` is what bounds the harm either way.
#
# It never touches a responsive session, idle or not: the probe is answered by the ssh client
# itself, not by anything the user is doing. 60 s x 3 = a session is reaped about three
# minutes after its client stops answering. Background work started with `nohup` survives,
# because it is reparented to init and leaves the session's process group.
ClientAliveInterval 60
ClientAliveCountMax 3
