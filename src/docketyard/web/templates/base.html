<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}An independent public record of proceedings before the Surface Transportation Board.{% endblock %}">
  <link rel="stylesheet" href="/static/site.css">
  <script>
    // per-viewer display preferences, kept in this browser only (ADR 0011): never an account
    try {
      const p = JSON.parse(localStorage.getItem("dy.prefs") || "{}");
      for (const k of ["theme", "density", "ids"]) if (p[k]) document.documentElement.dataset[k] = p[k];
    } catch (e) {}
  </script>
</head>
<body>
<div class="sheet">
  <div class="prefs no-print" role="group" aria-label="Display preferences">
    <span class="prefs-label">Display</span>
    <button class="chip chip-small" type="button" data-pref="density" data-value="compact">Compact</button>
    <button class="chip chip-small" type="button" data-pref="ids" data-value="on">Record IDs</button>
    <button class="chip chip-small" type="button" data-pref="theme" data-value="dark">Dark</button>
    <span class="prefs-note">Kept in this browser only</span>
  </div>
  <header class="masthead no-print">
    <div class="masthead-left">
      <a class="wordmark serif" href="/">{{ site_name }}</a>
      <nav class="nav">
        <a href="/">This week</a>
      </nav>
    </div>
    <form class="lookup" action="/d" method="get">
      <input name="q" type="search" placeholder="Docket number, e.g. FD 36873" aria-label="Docket number">
    </form>
  </header>
  <main>{% block main %}{% endblock %}</main>
  <footer class="footer">
    <div class="footer-links">
      <span>Methodology, coverage, corrections and privacy pages are being written.</span>
    </div>
    <div>{{ site_name }} is operated by RMI Valuation, LLC and is not affiliated with the Surface Transportation Board.</div>
  </footer>
</div>
<script>
  // preference chips: browser-stored only, never sent anywhere (ADR 0011)
  (function () {
    const root = document.documentElement, key = "dy.prefs";
    const read = () => { try { return JSON.parse(localStorage.getItem(key) || "{}"); } catch (e) { return {}; } };
    document.querySelectorAll("[data-pref]").forEach((chip) => {
      const k = chip.dataset.pref, v = chip.dataset.value;
      const sync = () => chip.classList.toggle("chip-on", root.dataset[k] === v);
      sync();
      chip.addEventListener("click", () => {
        const p = read();
        if (root.dataset[k] === v) { delete p[k]; delete root.dataset[k]; } else { p[k] = v; root.dataset[k] = v; }
        try { localStorage.setItem(key, JSON.stringify(p)); } catch (e) {}
        sync();
      });
    });
  })();
</script>
</body>
</html>
